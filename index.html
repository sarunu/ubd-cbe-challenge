'ผู้เรียนสามารถใช้หลักการทางวิทยาศาสตร์และหลักฐานจากการสำรวจออกแบบแนวทางลดเสียงรบกวนที่สัมพันธ์กับสาเหตุของปัญหาและเหมาะสมกับบริบทของโรงเรียน',

{id:'S1M1',stage:'s1',title:'องค์ประกอบ Stage 1 ทำหน้าที่อะไร?',type:'matching',instruction:'ลากป้ายรายละเอียดไปจับคู่กับองค์ประกอบทั้ง 4 ให้ถูกต้อง',input:'context',targets:[['eu','ความเข้าใจที่ยั่งยืน','(EU)'],['eq','คำถามสำคัญ','(EQ)'],['clo','ผลการเรียนรู้เชิงสมรรถนะของหน่วย','(CLO)'],['ksa','K–S–A','ความรู้ · ทักษะ · เจตคติและคุณค่า']],cards:[{id:'a',text:'สิ่งที่ต้องการให้ผู้เรียนมองเห็นความสัมพันธ์ของแนวคิด และยังนำความเข้าใจนั้นไปใช้ได้เมื่อเปลี่ยนสถานการณ์',correct:'eu'},{id:'b',text:'ข้อความที่ใช้เปิดการคิดและย้อนกลับมาพิจารณาได้ตลอดหน่วย เพื่อช่วยให้ผู้เรียนค่อย ๆ สร้างความเข้าใจที่ลึกขึ้น',correct:'eq'},{id:'c',text:'สิ่งที่คาดหวังให้ผู้เรียนแสดงให้เห็นเมื่อสิ้นสุดหน่วย โดยต้องนำสิ่งที่เรียนรู้หลายด้านมาประกอบกันในการปฏิบัติ',correct:'clo'},{id:'d',text:'ทรัพยากรภายในของผู้เรียนที่ต้องได้รับการพัฒนาและระดมใช้ เพื่อให้สามารถปฏิบัติได้ตามเป้าหมายของหน่วย',correct:'ksa'}],hints:['แยกว่าอะไรคือ ความเข้าใจ ข้อความเปิดการคิด ความสามารถปลายทาง และทรัพยากรที่ใช้ไปถึงปลายทาง','CLO คือสิ่งที่ผู้เรียนต้องแสดงได้ปลายหน่วย ส่วน K–S–A คือฐานที่ต้องระดมใช้'],success:'องค์ประกอบทั้ง 4 ทำหน้าที่ต่างกัน แต่ทำงานเชื่อมกันใน Stage 1',reviewTitle:'องค์ประกอบ Stage 1'},
{id:'S1M2',stage:'s1',title:'CLO ใดสังเคราะห์จากกลุ่มตัวชี้วัดได้เหมาะสมที่สุด?',type:'choice',instruction:'เลือก CLO ที่หลอมรวมตัวชี้วัดเป็นความสามารถปลายทาง ไม่ใช่นำตัวชี้วัดมาต่อเป็นรายการ และไม่เขียนเป็นขั้นตอนของ Performance Task',input:'indicators',options:[{id:'a',correct:true,text:REF.clo,details:'หลอมรวมความรู้ กระบวนการทางวิทยาศาสตร์ การใช้ข้อมูล การร่วมตัดสินใจ การออกแบบ/ทดสอบแนวทาง และการสื่อสารเป็นความสามารถองค์รวม โดยไม่ระบุพื้นที่หรือชิ้นงานเฉพาะ',fb:'เป็นความสามารถองค์รวมที่สังเคราะห์จากตัวชี้วัดและเปิดให้สมรรถนะทั้ง 4 ด้านปรากฏได้'},{id:'b',text:'ผู้เรียนสามารถอธิบายการเดินทางของเสียง ทดลองเสียงสูง–ต่ำและดัง–ค่อย วัดระดับเสียง เขียนแผนภูมิ ใช้เทคโนโลยีนำเสนอข้อมูล เขียนรายงาน และพูดนำเสนอได้อย่างถูกต้อง',details:'ครอบคลุมตัวชี้วัดหลายข้อ แต่ยังเป็นการเรียงความรู้และทักษะย่อยทีละรายการ จึงไม่เห็นความสามารถองค์รวมที่ต้องระดมใช้ร่วมกัน',fb:'ยังเป็นรายการผลย่อยตามตัวชี้วัด มากกว่าสังเคราะห์เป็น CLO'},{id:'c',text:'ผู้เรียนเลือกพื้นที่เงียบในโรงเรียน สำรวจแหล่งเสียง วัดระดับเสียง ทำแผนภูมิ สร้างต้นแบบลดเสียง ทดสอบก่อน–หลัง แล้วนำเสนอข้อเสนอต่อครูหรือผู้บริหาร',details:'เป็นภารกิจที่มีบริบท ผู้รับสาร และขั้นตอนการทำงานชัดเจน จึงเหมาะเป็น Performance Task มากกว่าเป็น CLO',fb:'ข้อความนี้เป็นลักษณะของ Performance Task เพราะผูกกับสถานที่ บทบาท และขั้นตอนของภารกิจเฉพาะ'}],hints:['CLO ต้องหลอมรวมตัวชี้วัดเป็นความสามารถ ไม่ใช่เรียงสิ่งที่ต้องสอนให้ครบ','Performance Task บอกบริบทและภารกิจเฉพาะ ส่วน CLO บอกความสามารถที่ต้องการให้ผู้เรียนแสดง'],success:'CLO นี้สังเคราะห์ตัวชี้วัดเป็นความสามารถองค์รวม และรองรับสมรรถนะหลักทั้ง 4 ด้าน',reviewTitle:'CLO'},
{id:'S1M3',stage:'s1',title:'สมรรถนะหลักใดควรพัฒนาและประเมินในหน่วยนี้?',type:'multi',instruction:'เลือกสมรรถนะที่ปรากฏเป็นเป้าหมายใน CLO และมีโอกาสสร้างหลักฐานจาก Performance Task ไม่จำเป็นต้องเลือกครบทุกด้าน',input:'cloIndicators',options:[{id:'self',text:'การจัดการตนเอง',detail:'กำหนดเป้าหมาย กำกับตนเอง และจัดการเวลา อารมณ์ หรือพฤติกรรมให้เหมาะกับภารกิจ'},{id:'thinking',text:'การคิดขั้นสูง',detail:'วิเคราะห์ข้อมูล ระบุรูปแบบและสาเหตุ ใช้หลักฐานตัดสินใจ ออกแบบ ทดสอบ และปรับแนวทาง',correct:true},{id:'communication',text:'การสื่อสาร',detail:'เขียนและพูดรายงาน ใช้ข้อมูล แผนภูมิ และเหตุผลทางวิทยาศาสตร์สื่อสารข้อเสนอแก่ผู้เกี่ยวข้อง',correct:true},{id:'team',text:'การรวมพลังทำงานเป็นทีม',detail:'ร่วมวางแผน แบ่งบทบาท รับผิดชอบงาน แลกเปลี่ยนข้อมูลและเหตุผล ประสานการทำงาน และตัดสินใจร่วมกันโดยใช้หลักฐาน',correct:true},{id:'citizen',text:'การเป็นพลเมืองที่เข้มแข็ง',detail:'ตระหนักสิทธิ หน้าที่ ส่วนรวม และมีส่วนร่วมต่อประเด็นสาธารณะอย่างรับผิดชอบ'},{id:'nature',text:'การอยู่ร่วมกับธรรมชาติและวิทยาการอย่างยั่งยืน',detail:'ใช้ความรู้เรื่องเสียงและหลักฐานทางวิทยาศาสตร์เสนอแนวทางที่คำนึงถึงสุขภาวะ การใช้พื้นที่ร่วมกัน และความเหมาะสมของบริบท',correct:true}],hints:['ตรวจย้อนกลับไปที่ CLO ว่ามีพฤติกรรมใดระบุไว้เป็นผลลัพธ์จริง','การทำงานเป็นทีมจะเป็นสมรรถนะเป้าหมายได้เมื่อ CLO กำหนดการร่วมวางแผน แลกเปลี่ยนเหตุผล แบ่งบทบาท และตัดสินใจร่วมกันอย่างชัดเจน'],success:'หน่วยนี้มุ่งพัฒนาและประเมินสมรรถนะหลัก 4 ด้านตาม CLO และ Performance Task',reviewTitle:'สมรรถนะหลัก'},
{id:'S1M4',stage:'s1',title:'อะไรคือ K–S–A ที่จำเป็นต่อ CLO?',type:'dual',instruction:'พิจารณาทีละป้าย: จัดเป็น K, S หรือ A และตัดสินว่า จำเป็นต่อ CLO หรือไม่',input:'cloCompetencies',cards:[{id:'k1',text:'ความรู้เรื่องการเกิดและการเดินทางของเสียงผ่านตัวกลาง รวมถึงปัจจัยที่สัมพันธ์กับเสียงสูง–ต่ำและดัง–ค่อย',type:'K',need:'yes'},{id:'k2',text:'ความหมายและการใช้ข้อมูลระดับเสียง รวมถึงผลกระทบและแนวทางลดมลพิษทางเสียง',type:'K',need:'yes'},{id:'k3',text:'หลักการอ่าน/สร้างแผนภูมิแท่ง และหลักการเลือก จัดกระทำ และนำเสนอข้อมูลให้ตรงวัตถุประสงค์',type:'K',need:'yes'},{id:'k4',text:'ประวัติการประดิษฐ์เครื่องมือวัดระดับเสียงและชื่อผู้พัฒนาเครื่องมือแต่ละยุค',type:'K',need:'no'},{id:'s1',text:'ตั้งคำถาม ระบุตัวแปร ออกแบบและดำเนินการทดลอง และใช้เครื่องมือวัดระดับเสียงอย่างเป็นระบบ',type:'S',need:'yes'},{id:'s2',text:'รวบรวม ประเมิน จัดระเบียบ และนำเสนอข้อมูลด้วยซอฟต์แวร์หรือบริการดิจิทัล รวมทั้งสร้างและตีความแผนภูมิแท่ง',type:'S',need:'yes'},{id:'s3',text:'วิเคราะห์หลักฐานหลายส่วน ออกแบบและทดสอบแนวทาง เปรียบเทียบข้อมูลก่อน–หลัง และปรับข้อเสนอจากผลการทดสอบ',type:'S',need:'yes'},{id:'s4',text:'ร่วมวางแผน แบ่งบทบาท แลกเปลี่ยนข้อมูลและเหตุผล ประสานงาน และตัดสินใจร่วมกันโดยใช้หลักฐาน',type:'S',need:'yes'},{id:'s5',text:'เขียนข้อเสนอ พูดรายงาน และตอบคำถามโดยใช้หลักฐานสนับสนุน',type:'S',need:'yes'},{id:'a1',text:'ซื่อสัตย์ต่อหลักฐาน บันทึกข้อมูลตามจริง และพร้อมปรับแนวคิดหรือแนวทางเมื่อผลไม่เป็นไปตามที่คาด',type:'A',need:'yes'},{id:'a2',text:'ตระหนักต่อผลกระทบของเสียง รับผิดชอบต่อข้อมูล รับฟังและเคารพความคิดเห็นของสมาชิกและผู้เกี่ยวข้อง',type:'A',need:'yes'},{id:'a3',text:'รู้สึกสนุกและชื่นชอบการทดลองเรื่องเสียงเป็นพิเศษ',type:'A',need:'no'}],hints:['ถามว่า ถ้าตัดทรัพยากรนี้ออก ผู้เรียนยังทำ CLO ได้อย่างมีคุณภาพใกล้เคียงเดิมหรือไม่','ไม่ต้องทำ K–S–A ให้ครบเพราะรูปแบบแผน แต่เลือกเฉพาะทรัพยากรที่จำเป็นต่อความสามารถปลายทาง'],success:'K–S–A คือทรัพยากรที่จำเป็นต่อ CLO ไม่ใช่รายการทุกอย่างที่เกิดขึ้นในกิจกรรม',reviewTitle:'K–S–A'},
{id:'S2M1',stage:'s2',title:'หลักฐานแต่ละชนิดทำหน้าที่อะไร?',type:'matching',instruction:'จับคู่ชื่อองค์ประกอบกับหน้าที่ เพื่อเห็นระบบหลักฐานก่อนเลือกเครื่องมือประเมิน',input:'cloCompKsa',targets:[['pt','ภาระงานสะท้อนสมรรถนะ','(Performance Task)'],['rubric','เกณฑ์คุณภาพ','(Analytic Rubric)'],['other','หลักฐานอื่น','(Other Evidence)'],['aal','การประเมินขณะเรียนรู้','(Assessment as Learning: AaL)'],['afl','การประเมินเพื่อการเรียนรู้','(Assessment for Learning: AfL)'],['ksaAssess','การประเมินเพื่อตัดสิน K–S–A','']],cards:[{id:'a',text:'สถานการณ์ที่ทำให้ผู้เรียนต้องระดมความรู้ ทักษะ เจตคติ และสมรรถนะหลายด้านเพื่อสร้างการปฏิบัติหรือผลงานที่ตรวจสอบได้',correct:'pt'},{id:'b',text:'คำบรรยายระดับคุณภาพที่ใช้ตัดสินว่าสมรรถนะที่ปรากฏจาก Performance Task มีคุณภาพเพียงใด',correct:'rubric'},{id:'c',text:'หลักฐานอื่นนอกเหนือจาก Performance Task ที่ใช้ติดตาม พัฒนา หรือยืนยัน K–S–A ตามเป้าหมาย ทั้งระหว่างเรียนและเมื่อตัดสินผล',correct:'other'},{id:'d',text:'ผู้เรียนใช้หลักฐานหรือเกณฑ์ตรวจสอบงานและการเรียนรู้ของตน แล้วตัดสินใจว่าจะปรับอะไรต่อ',correct:'aal'},{id:'e',text:'ครูใช้หลักฐานระหว่างทางวินิจฉัยความเข้าใจ ให้ Feedback และปรับการสนับสนุนเพื่อให้การเรียนรู้ก้าวหน้าต่อ',correct:'afl'},{id:'f',text:'เมื่อจำเป็นต้องสรุปผลฐาน K, S หรือ A ใช้หลักฐานเฉพาะด้านที่ตรงกับธรรมชาติของสิ่งนั้น โดยไม่สรุปแทนสมรรถนะองค์รวม',correct:'ksaAssess'}],hints:['ถามว่า ใครใช้หลักฐาน ใช้ดูอะไร และใช้ผลเพื่อพัฒนาหรือตัดสินอะไร','Performance Task + Rubric ใช้กับสมรรถนะองค์รวม ส่วน Other Evidence ช่วยยืนยันฐาน K–S–A'],success:'ระบบหลักฐานแต่ละส่วนมีหน้าที่ต่างกัน แต่เชื่อมกันใน Stage 2',reviewTitle:'ระบบหลักฐาน'},
{id:'S2M2',stage:'s2',title:'Performance Task ใดทำให้เห็นว่า “ใช้ความรู้ได้จริง”?',type:'choice',instruction:'เลือกภาระงานที่ทำให้ผู้เรียนต้องร่วมกันใช้ K–S–A สร้างข้อมูล วิเคราะห์ สร้างทางเลือก ทดสอบ และตัดสินใจจากหลักฐาน',input:'cloCompKsaIndicators',options:[{id:'a',correct:true,text:REF.performanceTask,details:'ภารกิจมีเป้าหมาย บทบาท ผู้รับสาร สถานการณ์ ผลงาน และเกณฑ์คุณภาพครบในลักษณะ GRASPS พร้อมเปิดโอกาสให้ผู้เรียนระดม K–S–A และสมรรถนะตาม CLO เพื่อใช้หลักฐานตัดสินใจ',fb:'ภาระงานเปิดให้สมรรถนะทั้ง 4 ด้านปรากฏผ่านการใช้ความรู้และหลักฐานในสถานการณ์จริง'},{id:'b',text:'ผู้เรียนรับบทเป็นทีมศึกษาปัญหาเสียงของโรงเรียน โดยทดลองเรื่องการเดินทางของเสียง เสียงสูง–ต่ำและดัง–ค่อย วัดระดับเสียงในจุดที่กำหนด และนำข้อมูลมาสร้างตารางหรือแผนภูมิ จากนั้นรวบรวมผลการทดลองและความรู้ที่ได้จัดทำเป็นรายงานเรื่องเสียงและมลพิษทางเสียง พร้อมสรุปวิธีลดเสียงรบกวนที่ค้นคว้าได้ แล้วนำเสนอหน้าชั้นเรียน โดยพิจารณาความถูกต้องของเนื้อหา ความครบถ้วนของการทดลอง การจัดข้อมูล และความชัดเจนของการนำเสนอ',details:'มีบริบทและชิ้นงาน แต่ยังเน้นรวบรวมและรายงานความรู้มากกว่าการใช้หลักฐานวิเคราะห์ปัญหา สร้างทางเลือก และตัดสินใจแก้ปัญหาในสถานการณ์จริง',fb:'ภารกิจยังเน้นการรายงานความรู้และผลกิจกรรม มากกว่าการใช้ K–S–A แบบองค์รวมเพื่อแก้ปัญหา'},{id:'c',text:'ผู้เรียนรับบทเป็นทีมทดลองลดเสียง โดยเลือกวัสดุหรือวิธีลดเสียงจากรายการที่ครูกำหนด วางแผนทดลอง วัดระดับเสียงก่อนและหลังใช้วัสดุ บันทึกผล เปรียบเทียบข้อมูล และเลือกวิธีที่ลดเสียงได้มากที่สุด จากนั้นสร้างต้นแบบหรือแบบจำลองการลดเสียง พร้อมเขียนคำอธิบายหลักการทำงานและนำเสนอผลต่อเพื่อนในชั้น โดยพิจารณาความถูกต้องของการทดลอง ความครบถ้วนของข้อมูล ประสิทธิภาพของต้นแบบ และความชัดเจนของคำอธิบาย',details:'มีการทดลองและสร้างชิ้นงานจริง แต่สถานการณ์ วิธีดำเนินการ และทางเลือกถูกกำหนดไว้มาก จึงยังไม่เปิดโอกาสให้ผู้เรียนระดม K–S–A และความสามารถตาม CLO เพื่อวิเคราะห์ปัญหา เลือกแนวทาง และใช้หลักฐานสนับสนุนการตัดสินใจได้อย่างเพียงพอ',fb:'ภารกิจมีการทดลองและชิ้นงาน แต่การตัดสินใจสำคัญยังถูกกำหนดไว้มากเกินไป'}],hints:['Performance Task ที่ดีต้องทำให้ผู้เรียนระดม K–S–A และใช้ความสามารถตาม CLO แบบองค์รวม เพื่อจัดการสถานการณ์และตัดสินใจจากหลักฐาน ไม่ใช่เพียงทำกิจกรรมหลายขั้นหรือสร้างชิ้นงาน','มองหาภารกิจที่เปิดให้ผู้เรียนวิเคราะห์ปัญหา สร้างและทดสอบทางเลือก แล้วสื่อสารข้อเสนอต่อผู้รับสารที่มีความหมาย'],success:'Performance Task นี้ทำให้เห็นการระดม K–S–A และสมรรถนะหลักทั้ง 4 ด้าน',after:'alignmentTask',reviewTitle:'Performance Task'},
{id:'S2M3',stage:'s2',title:'Rubric ใดตัดสินคุณภาพของสมรรถนะได้ตรงที่สุด?',type:'choice',instruction:'พิจารณาว่าเกณฑ์หลักย้อนกลับไปยังสมรรถนะ 4 ด้านที่เลือกไว้ หรือเพียงตรวจชิ้นส่วนของงาน',input:'rubricInput',options:[{id:'a',correct:true,text:'Analytic Rubric 4 ระดับ โดยใช้ การคิดขั้นสูง การสื่อสาร การรวมพลังทำงานเป็นทีม และการอยู่ร่วมกับธรรมชาติและวิทยาการอย่างยั่งยืน เป็นเกณฑ์หลัก',details:RUBRIC_CORRECT,fb:'ชื่อแถวตรงกับสมรรถนะหลัก และคำบรรยายระดับคุณภาพอ้างพฤติกรรมจาก Performance Task'},{id:'b',text:'Analytic Rubric 4 ระดับ โดยใช้ การวัดระดับเสียง การสร้างแผนภูมิ การวิเคราะห์ข้อมูล และการเสนอแนวทาง เป็นเกณฑ์หลัก',details:RUBRIC_SKILLS,fb:'เกณฑ์เหล่านี้เป็นทักษะย่อยและส่วนประกอบของงาน เหมาะกับการประเมิน S มากกว่าตัดสินสมรรถนะหลักทั้ง 4 ด้าน'},{id:'c',text:'Analytic Rubric 4 ระดับ โดยใช้ ความชัดเจนของข้อมูล ความสมเหตุสมผลของข้อเสนอ ความถูกต้องของภาษา และประสิทธิภาพการนำเสนอ เป็นเกณฑ์หลัก',details:RUBRIC_PRODUCT,fb:'เกณฑ์เน้นคุณภาพของชิ้นงาน/การนำเสนอ แต่ยังไม่ครอบคลุมการคิด การทำงานร่วมกัน และความรับผิดชอบต่อบริบทตามสมรรถนะเป้าหมาย'}],hints:['Rubric ระดับสมรรถนะควรใช้ชื่อแถวเดียวกับสมรรถนะที่เลือกไว้','ทักษะย่อยและองค์ประกอบชิ้นงานมีประโยชน์ แต่ไม่ควรแทนสมรรถนะหลักโดยอัตโนมัติ'],success:'Rubric นี้ย้อนกลับไปยังสมรรถนะหลัก 4 ด้านและตัดสินคุณภาพจาก Performance Task ได้ตรงที่สุด',after:'alignmentRubric',reviewTitle:'Analytic Rubric'},
{id:'S2M4',stage:'s2',title:'หลักฐานนี้ใช้เพื่ออะไร และยืนยันอะไร?',type:'evidence',instruction:'ใน 2 แถวแรกมีตัวอย่างล็อกไว้แล้ว 2 ช่อง ส่วนแถว AoL ให้เลือกหลักฐานมาวางให้ครบทั้งแถว โดยพิจารณาพร้อมกันว่าใช้เป็น AaL / AfL / AoL และช่วยพัฒนาหรือยืนยัน K / S / A ด้านใด',input:'ksaTaskRubric',cards:[
{id:'aalk',text:'ผู้เรียนใช้เกณฑ์ตรวจคำอธิบายของตนว่า ข้อสรุปเรื่องการเดินทางของเสียงมีหลักฐานจากการทดลองรองรับหรือไม่ แล้วปรับคำอธิบาย',correct:'aalK'},
{id:'aals',text:'ผู้เรียนใช้ Checklist ตรวจ Test Plan ว่า จุดวัด เงื่อนไข และข้อมูลก่อน–หลังเพียงพอที่จะเปรียบเทียบกันได้หรือไม่ แล้วปรับแผนก่อนทดลอง',correct:'aalS'},
{id:'aala',text:'ผู้เรียนสะท้อนว่าตนบันทึกและใช้ข้อมูลตามที่พบจริงหรือไม่ แม้ผลไม่ตรงกับที่คาด และระบุสิ่งที่ควรปรับในการทำงานของตน',correct:'aalA'},
{id:'aflk',text:'ครูฟังคำอธิบายเรื่องเสียงและผลการทดลอง แล้วตั้งคำถามเพื่อช่วยให้ผู้เรียนเชื่อมข้อสรุปกับหลักฐานได้ถูกต้องขึ้น',correct:'aflK'},
{id:'afls',text:'ครูสังเกตการใช้เครื่องมือและการเก็บข้อมูล แล้วให้ Feedback เมื่อวิธีวัดหรือเงื่อนไขอาจทำให้ข้อมูลไม่น่าเชื่อถือ',correct:'aflS'},
{id:'afla',text:'ครูสังเกตการใช้ข้อมูลของกลุ่ม และตั้งคำถามเมื่อผู้เรียนเลือกใช้เฉพาะข้อมูลที่สนับสนุนความคิดเดิมของตน',correct:'aflA'},
{id:'aolk',text:'ใช้คำอธิบายหรือแบบทดสอบที่ออกตรงกับความรู้เรื่องการเกิดและการเดินทางของเสียง ระดับเสียง และมลพิษทางเสียง เพื่อตัดสินความรู้เมื่อสิ้นช่วงการเรียนรู้',correct:'aolK'},
{id:'aols',text:'ใช้หลักฐานการปฏิบัติจริงในการวางแผน ทดลอง ใช้เครื่องมือ เก็บ ตรวจสอบ และวิเคราะห์ข้อมูล เพื่อตัดสินทักษะที่กำหนดไว้',correct:'aolS'},

function newSessionId(){return 'UBD2-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,8).toUpperCase()}
const state={sessionId:newSessionId(),participant:{name:'',org:''},current:0,completed:new Set(),answers:{},orders:{},placements:{},dual:{},bridgeStep:0,hints:{},attempts:{},firstTry:{},firstChoice:{},reviewHistory:[],missionStarted:0,missionDur:{},startedAt:null,finishedAt:null,submitted:false,selectedCard:null,shuffle:{},bridgePlacements:{},bridgeOrder:null,evidencePlacements:{},expandedChoiceDetails:{}};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function currentMission(){return MISSIONS[state.current]}function idx(id){return MISSIONS.findIndex(x=>x.id===id)}function shorten(s,n){return s.length>n?s.slice(0,n)+'…':s}function shuffle(ids,key){const current=[...ids];if(!state.shuffle[key]){const a=[...current];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}state.shuffle[key]=a;return a}const allowed=new Set(current),cached=state.shuffle[key];const kept=cached.filter(id=>allowed.has(id)),missing=current.filter(id=>!cached.includes(id));return [...kept,...missing]}
function startGame(){const name=playerName.value.trim(),org=playerOrg.value.trim();if(!name||!org){alert('กรุณากรอกชื่อและโรงเรียน/หน่วยงาน');return}state.participant={name,org};state.startedAt=new Date().toISOString();welcome.classList.add('hidden');gameUI.classList.remove('hidden');renderBrief();updateProgress()}
function renderBrief(){briefScreen.classList.remove('hidden');missionScreen.classList.add('hidden');finalScreen.classList.add('hidden');briefScreen.innerHTML=`<div class="stage-head"><div class="kicker">ข้อมูลตั้งต้น</div><h1>พื้นที่สงบของเรา: ใช้ข้อมูลแก้ปัญหาเสียงรบกวนในโรงเรียน</h1><p>ป.5 · วิทยาศาสตร์และเทคโนโลยี บูรณาการคณิตศาสตร์และภาษาไทย · 8 ชั่วโมง</p></div><div class="panel"><div class="brief-grid"><div class="ref-card"><h3>สถานการณ์ของหน่วย</h3><p>โรงเรียนมีพื้นที่ที่ควรมีความสงบ แต่ได้รับเสียงรบกวนจากบริเวณใกล้เคียง ผู้เรียนต้องใช้ความรู้เรื่องเสียงและข้อมูลจากการตรวจสอบ เพื่อทำความเข้าใจปัญหา พัฒนาและทดสอบแนวทางลดการรบกวน แล้วสื่อสารข้อเสนอที่มีหลักฐานรองรับ</p><div class="section-note">ผลจากด่านก่อนหน้าจะกลายเป็นข้อมูลของด่านถัดไป</div></div><div class="brief-grid">${indicatorHtml()}</div></div><div class="actions"><span class="subtle">ข้อมูลตั้งต้นย้อนทบทวนได้ตลอดเกม</span><button class="btn" onclick="beginMissions()">เริ่ม Stage 1 →</button></div></div>`}
function beginMissions(){briefScreen.classList.add('hidden');missionScreen.classList.remove('hidden');state.current=0;enterMission()}function enterMission(){state.selectedCard=null;state.missionStarted=Date.now();renderMission();updateProgress();scrollTo({top:0,behavior:'smooth'})}
function inputPanel(k){const ind=`<button class="ref-link" onclick="showReference('indicators')">ดูตัวชี้วัดต้นทางทั้งหมด</button>`,clo=`<div class="ref-card"><h3>CLO</h3><p>${REF.clo}</p></div>`,comp=`<div class="ref-card"><h3>สมรรถนะหลัก 4 ด้าน</h3><ul>${REF.competencies.map(x=>`<li>${x}</li>`).join('')}</ul></div>`,ksa=`<div class="ref-card"><h3>K–S–A</h3><button class="ref-link" onclick="showReference('ksa')">ดูฉบับเต็ม</button></div>`,task=`<div class="ref-card"><h3>ภาระงานสะท้อนสมรรถนะ</h3><p>${shorten(REF.performanceTask,360)}</p></div>`;switch(k){case'context':return `<div class="ref-card"><h3>บริบทของหน่วย</h3><p>โรงเรียนมีพื้นที่ที่ควรมีความสงบ แต่ได้รับเสียงรบกวนจากบริเวณใกล้เคียง</p>${ind}</div>`;case'indicators':return `<div class="ref-card"><h3>กลุ่มตัวชี้วัดของหน่วย</h3><p class="mini">CLO ต้องสังเคราะห์จากตัวชี้วัดทั้ง 9 ตัว ไม่ใช่นำข้อความมาต่อกัน</p></div><div class="brief-grid">${indicatorHtml()}</div>`;case'cloIndicators':return clo+`<div class="ref-card">${ind}</div>`;case'cloCompetencies':return clo+comp+`<div class="ref-card">${ind}</div>`;case'cloCompKsa':return clo+comp+ksa;case'cloCompKsaIndicators':return clo+comp+ksa+`<div class="ref-card">${ind}</div>`;case'rubricInput':return clo+task+comp;case'ksaTaskRubric':return ksa+task+`<div class="ref-card"><h3>Analytic Rubric</h3><button class="ref-link" onclick="showReference('rubric')">เปิดฉบับเต็ม</button></div>`;case'otherEvidence':return `<div class="ref-card"><h3>Other Evidence</h3><p>หลักฐานอื่นนอกเหนือจาก Performance Task ที่ใช้ติดตาม พัฒนา หรือยืนยัน K–S–A ตามเป้าหมาย ทั้งระหว่างเรียนและเมื่อตัดสินผล</p></div>`;case'assessmentInput':return ksa+`<div class="ref-card"><h3>สายสมรรถนะ</h3><p>สมรรถนะหลัก → Performance Task → Analytic Rubric</p></div><div class="ref-card"><h3>สายฐาน K–S–A</h3><p>K–S–A → Other Evidence → AaL/AfL/AoL ตามหน้าที่ของหลักฐาน</p></div>`;case'subcloInput':return clo+ksa+task+comp;case'subcloOrderInput':return clo+task;case'subcloActivityInput':return `<div class="ref function renderMission(){const m=currentMission();missionScreen.innerHTML=`<div class="stage-head"><div class="kicker">${STAGES[m.stage].label} · ${m.id}</div><h1>${m.title}</h1><p>${m.instruction}</p></div><div class="split-layout"><aside class="sidebar"><div class="ref-card"><h3>ข้อมูลที่ใช้ในการตัดสินใจ</h3><p class="mini">ข้อมูลจากสิ่งที่สร้างผ่านด่านก่อนหน้า</p></div>${inputPanel(m.input)}</aside><div class="panel"><div id="missionBody"></div><div id="hintBox" class="hintbox"></div><div id="feedback" class="feedback"></div><div class="actions"><button class="btn ghost" onclick="useHint()">💡 คำใบ้</button><div id="missionActions" class="btn-row"></div></div></div></div>`;const b=missionBody;m.type==='matching'?renderMatching(m,b):m.type==='choice'?renderChoice(m,b):m.type==='multi'?renderMulti(m,b):m.type==='dual'?renderDual(m,b):m.type==='evidence'?renderEvidenceMatrix(m,b):m.type==='order'?renderOrder(m,b):renderBridge();updateProgress()}
function setActions(h){missionActions.innerHTML=h}function showFeedback(ok,msg){feedback.className='feedback show '+(ok?'good':'warn');feedback.innerHTML=msg}function addNextButton(){if(!missionActions.querySelector('[data-next]'))missionActions.insertAdjacentHTML('beforeend','<button class="btn" data-next onclick="nextMission()">ไปต่อ →</button>')}function useHint(){const m=currentMission();state.hints[m.id]=(state.hints[m.id]||0)+1;const i=Math.min(state.hints[m.id]-1,1);hintBox.className='hintbox show';hintBox.textContent='💡 '+m.hints[i]}function attempt(id,ans){state.attempts[id]=(state.attempts[id]||0)+1;if(state.firstChoice[id]===undefined)state.firstChoice[id]=JSON.parse(JSON.stringify(ans))}
function pass(m,explain=''){if(state.completed.has(m.id))return;state.completed.add(m.id);state.missionDur[m.id]=Math.round((Date.now()-state.missionStarted)/1000);if(state.attempts[m.id]===1)state.firstTry[m.id]=true;const extra=explain?`<div style="margin-top:8px;padding-top:8px;border-top:1px solid #c8decf"><strong>เหตุผลของคำตอบ:</strong><div style="margin-top:4px">${explain}</div></div>`:'';showFeedback(true,'✓ '+m.success+extra);addNextButton();updateProgress()}function nextMission(){if(state.current===MISSIONS.length-1){finishGame();return}state.current++;enterMission()}
function renderMatching(m,b,key=m.id,store=state.placements){store[key]??={};const p=store[key],ord=shuffle(m.cards.map(x=>x.id),'sh-'+key);b.innerHTML=`<div class="target-grid">${m.targets.map(t=>`<div class="dropzone" onclick="placeSel('${key}','${t[0]}')" ondragover="event.preventDefault();this.classList.add('ready')" ondragleave="this.classList.remove('ready')" ondrop="dropIt(event,'${key}','${t[0]}')"><h3>${t[1]}${t[2]?`<small>${t[2]}</small>`:''}</h3><div id="z-${key}-${t[0]}"></div></div>`).join('')}</div><div class="bank" id="bank-${key}"></div>`;ord.forEach(id=>{const c=m.cards.find(x=>x.id===id),tar=Object.keys(p).find(k=>p[k]===id||Array.isArray(p[k])&&p[k].includes(id));if(tar){document.getElementById(`z-${key}-${tar}`).insertAdjacentHTML('beforeend',`<div class="placed-card">${c.text}<div><button class="mini-btn" onclick="event.stopPropagation();unplace('${key}','${id}')">คืนป้าย</button></div></div>`)}else document.getElementById('bank-'+key).insertAdjacentHTML('beforeend',`<div class="drag-card ${state.selectedCard===key+'|'+id?'selected':''}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${key}|${id}')" onclick="selectCard('${key}','${id}')"><div class="card-id">ป้าย</div><div>${c.text}</div></div>`)});setActions(`<button class="btn" onclick="checkMatching('${key}')">ตรวจคำตอบ</button>`)}
function keyMission(key){return MISSIONS.find(x=>x.id===key)}function keyStore(key){return state.placements}function selectCard(k,id){state.selectedCard=k+'|'+id;renderMatching(keyMission(k),missionBodyOrBridge(),k,keyStore(k))}function placeSel(k,t){if(!state.selectedCard?.startsWith(k+'|'))return;assign(k,state.selectedCard.split('|')[1],t);state.selectedCard=null}function dropIt(e,k,t){e.preventDefault();const d=e.dataTransfer.getData('text/plain');if(d.startsWith(k+'|'))assign(k,d.split('|')[1],t)}function assign(k,id,t){const m=keyMission(k),s=keyStore(k);s[k]??={};Object.keys(s[k]).forEach(x=>{if(Array.isArray(s[k][x]))s[k][x]=s[k][x].filter(v=>v!==id);else if(s[k][x]===id)delete s[k][x]});const cap=m.cards.filter(c=>c.correct===t).length;if(cap>1){s[k][t]??=[];s[k][t].push(id)}else s[k][t]=id;renderMatching(m,missionBodyOrBridge(),k,s)}function unplace(k,id){const s=keyStore(k);Object.keys(s[k]||{}).forEach(x=>{if(Array.isArray(s[k][x]))s[k][x]=s[k][x].filter(v=>v!==id);else if(s[k][x]===id)delete s[k][x]});renderMatching(keyMission(k),missionBodyOrBridge(),k,s)}function missionBodyOrBridge(){return document.getElementById('bridgeBody')||missionBody}function checkMatching(k){const m=keyMission(k),p=keyStore(k)[k]||{};if(!m.cards.every(c=>Object.values(p).some(v=>v===c.id||Array.isArray(v)&&v.includes(c.id))))return showFeedback(false,'ยังมีป้ายที่ยังไม่ได้จับคู่');attempt(k,p);let wrong=0;m.cards.forEach(c=>{const t=Object.keys(p).find(x=>p[x]===c.id||Array.isArray(p[x])&&p[x].includes(c.id));if(t!==c.correct)wrong++});if(wrong)return showFeedback(false,`ยังมี ${wrong} ป้ายที่ควรพิจารณาใหม่`);k==='BR-ASSESS'?bridgePassed():pass(currentMission())}
function renderChoice(m,b){const ord=shuffle(m.options.map(x=>x.id),'ch-'+m.id);b.innerHTML=`<div class="choice-list">${ord.map(id=>{const o=m.options.find(x=>x.id===id),selected=state.answers[m.id]===id;const detailBtn=m.id==='S2M3'?`<div style="margin-top:12px"><button class="mini-btn" onclick="event.stopPropagation();toggleChoiceDetails('${m.id}','${id}')">${state.expandedChoiceDetails[m.id]===id?'ซ่อนรายละเอียด':'ดูรายละเอียดตาราง Rubric'}</button></div>`:'';const detail=m.id==='S2M3'&&state.expandedChoiceDetails[m.id]===id?`<div class="section-note" style="margin-top:12px;overflow-x:auto"><strong>รายละเอียดตาราง Rubric</strong>${o.details}</div>`:'';return `<div class="choice-card ${selected?'selected':''}" onclick="state.answers['${m.id}']='${id}';renderMission()"><div class="badge">ตัวเลือก</div><div class="choice-text">${o.text}</div>${detailBtn}${detail}</div>`}).join('')}</div>`;setActions(`<button class="btn" onclick="checkChoice()">ตรวจคำตอบ</button>`)}function toggleChoiceDetails(mid,id){state.expandedChoiceDetails[mid]=state.expandedChoiceDetails[mid]===id?null:id;renderMission()}function checkChoice(){const m=currentMission(),id=state.answers[m.id];if(!id)return showFeedback(false,'เลือกคำตอบก่อนครับ');attempt(m.id,id);const o=m.options.find(x=>x.id===id);if(o.correct){if(m.id==='S2M3')return pass(m,o.fb||'');return pass(m,o.details||'')}showFeedback(false,'ลองพิจารณาอีกครั้ง: '+o.fb)}
function renderMulti(m,b){state.answers[m.id]??=[];b.innerHTML=`<div class="comp-grid">${m.options.map(o=>`<div class="comp-card ${state.answers[m.id].includes(o.id)?'selected':''}" onclick="toggleMulti('${o.id}')"><strong>${o.text}</strong><p>${o.detail}</p><div class="mini">คลิกเลือก/ยกเลิก</div></div>`).join('')}</div>`;setActions(`<button class="btn" onclick="checkMulti()">ตรวจคำตอบ</button>`)}function toggleMulti(id){const m=currentMission(),a=state.answers[m.id];state.answers[m.id]=a.includes(id)?a.filter(x=>x!==id):[...a,id];renderMission()}function checkMulti(){const m=currentMission(),a=state.answers[m.id];if(!a.length)return showFeedback(false,'เลือกอย่างน้อย 1 ข้อ');attempt(m.id,a);const c=m.options.filter(x=>x.correct).map(x=>x.id).sort().join('|');if([...a].sort().join('|')===c)return pass(m);if(m.id==='S1M3'){const need=m.options.filter(x=>x.correct&&!a.includes(x.id)).map(x=>x.text),extra=m.options.filter(x=>!x.correct&&a.includes(x.id)).map(x=>x.text);let msg='ยังไม่ตรงกับ CLO ทั้งหมด ';if(need.length)msg+=`ยังขาด: ${need.join(' · ')} `;if(extra.length)msg+=`ส่วนที่ยังไม่มีหลักฐานเป้าหมายชัดพอ: ${extra.join(' · ')}`;return showFeedback(false,msg)}showFeedback(false,'ยังมีบางตัวเลือกที่ควรพิจารณาใหม่')}
function renderDual(m,b){state.dual[m.id]??={};b.innerHTML=m.cards.map((c,i)=>{const a=state.dual[m.id][c.id]||{};return `<div class="dual-card"><div class="kicker">ป้าย ${i+1}/${m.cards.length}</div><h3>${c.text}</h3><div class="dual-controls"><div><div class="card-id">ประเภท</div><div class="seg">${['K','S','A'].map(x=>`<button class="${a.type===x?'active':''}" onclick="setDual('${c.id}','type','${x}')">${x}</button>`).join('')}</div></div><div><div class="card-id">ความจำเป็นต่อ CLO</div><div class="seg"><button class="${a.need==='yes'?'active':''}" onclick="setDual('${c.id}','need','yes')">จำเป็น</button><button class="${a.need==='no'?'active':''}" onclick="setDual('${c.id}','need','no')">ไม่จำเป็น</button></div></div></div></div>`}).join('');setActions(`<button class="btn" onclick="checkDual()">ตรวจทั้งหมด</button>`)}function setDual(id,k,v){const m=currentMission();state.dual[m.id][id]??={};state.dual[m.id][id][k]=v;renderMission()}function checkDual(){const m=currentMission(),a=state.dual[m.id];if(m.cards.some(c=>!a[c.id]?.type||!a[c.id]?.need))return showFeedback(false,'กรุณาจัดประเภทและตัดสินความจำเป็นให้ครบ');attempt(m.id,a);const w=m.cards.filter(c=>a[c.id].type!==c.type||a[c.id].need!==c.need);w.length?showFeedback(false,`ยังมี ${w.length} ป้ายที่ควรพิจารณาใหม่ โดยเฉพาะคำถามว่า สิ่งนี้จำเป็นต่อคุณภาพของ CLO จริงหรือไม่?`):pass(m)}
function evidenceMatrixSpec(){return{locked:{aalS:'aals',aalA:'aala',aflK:'aflk',aflA:'afla'},open:{aalK:'aalk',aflS:'afls',aolK:'aolk',aolS:'aols',aolA:'aola'}}}function renderEvidenceMatrix(m,b){const p=state.evidencePlacements[m.id]??={};state.evidencePlacements[m.id]=p;const rows=[['aal','AaL — การประเมินขณะเรียนรู้'],['afl','AfL — การประเมินเพื่อการเรียนรู้'],['aol','AoL — การประเมินเพื่อตัดสินผล']],cols=[['K','K — ความรู้'],['S','S — ทักษะ'],['A','A — เจตคติและคุณค่า']],spec=evidenceMatrixSpec(),placed=new Set(Object.values(p)),openIds=Object.values(spec.open);const cellHtml=(key,r,c)=>{const lockedId=spec.locked[key];if(lockedId){const card=m.cards.find(x=>x.id===lockedId);return `<td><div class="evidence-cell"><div class="mini">${r.toUpperCase()} × ${c}</div><div class="placed-card" style="opacity:.9"><span class="tag">ล็อกตัวอย่าง</span><br>${card.text}</div></div></td>`}const id=p[key],card=m.cards.find(x=>x.id===id);return `<td><div class="dropzone evidence-cell" onclick="placeEvidence('${key}')" ondragover="event.preventDefault();this.classList.add('ready')" ondragleave="this.classList.remove('ready')" ondrop="dropEvidence(event,'${key}')"><div class="mini">${r.toUpperCase()} × ${c} · เติม 1 ป้าย</div>${card?`<div class="placed-card">${card.text}<div><button class="mini-btn" onclick="event.stopPropagation();unplaceEvidence('${key}')">คืนป้าย</button></div></div>`:'<div class="mini" style="text-align:center;padding-top:10px">วางหลักฐานที่นี่</div>'}</div></td>`};const available=openIds.filter(id=>!placed.has(id));b.innerHTML=`<table class="rubric evidence-matrix"><tr><th></th>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr>${rows.map(r=>`<tr><td class="rowhead">${r[1]}</td>${cols.map(c=>cellHtml(r[0]+c[0],r[0],c[0])).join('')}</tr>`).join('')}</table><div class="bank" id="evidenceBank">${shuffle(openIds,'ev-'+m.id).filter(id=>available.includes(id)).map(id=>{const c=m.cards.find(x=>x.id===id);return `<div class="drag-card ${state.selectedCard===m.id+'|'+id?'selected':''}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','EV|${id}')" onclick="selectEvidence('${id}')"><div class="card-id">หลักฐานที่รอวาง</div><div>${c.text}</div></div>`}).join('')}</div>`;setActions(`<button class="btn" onclick="checkEvidenceMatrix()">ตรวจคำตอบ</button>`)}function selectEvidence(id){const m=currentMission(),spec=evidenceMatrixSpec();if(!Object.values(spec.open).includes(id))return;state.selectedCard=m.id+'|'+id;renderMission()}function placeEvidence(key){const m=currentMission(),spec=evidenceMatrixSpec();if(!spec.open[key])return;if(!state.selectedCard?.startsWith(m.id+'|'))return;const id=state.selectedCard.split('|')[1];assignEvidence(key,id)}function dropEvidence(e,key){e.preventDefault();const spec=evidenceMatrixSpec();if(!spec.open[key])return;const d=e.dataTransfer.getData('text/plain');if(d.startsWith('EV|'))assignEvidence(key,d.slice(3))}function assignEvidence(key,id){const m=currentMission(),spec=evidenceMatrixSpec(),p=state.evidencePlacements[m.id]??={};if(!spec.open[key]||!Object.values(spec.open).includes(id))return;Object.keys(p).forEach(k=>{if(p[k]===id)delete p[k]});p[key]=id;state.evidencePlacements[m.id]=p;state.selectedCard=null;renderMission()}function unplaceEvidence(key){const m=currentMission(),spec=evidenceMatrixSpec();if(!spec.open[key])return;const p=state.evidencePlacements[m.id]??={};delete p[key];state.selectedCard=null;renderMission()}function checkEvidenceMatrix(){const m=currentMission(),p=state.evidencePlacements[m.id]??{},spec=evidenceMatrixSpec(),keys=Object.keys(spec.open);if(keys.some(k=>!p[k]))return showFeedback(false,'ยังมีช่องที่ต้องเติมให้ครบทุกช่องที่เปิดไว้');attempt(m.id,p);let wrong=0;keys.forEach(k=>{if(p[k]!==spec.open[k])wrong++});wrong?showFeedback(false,`ยังมี ${wrong} ป้ายที่ควรพิจารณาใหม่ ลองถามว่า ใครใช้หลักฐาน ใช้เพื่ออะไร และหลักฐานนี้กำลังพัฒนาหรือยืนยัน K, S หรือ A`):pass(m)}

let dragOrd=null;function dropOrd(t){const m=currentMission(),a=state.orders[m.id],f=a.indexOf(dragOrd),to=a.indexOf(t);if(f<0)return;a.splice(f,1);a.splice(to,0,dragOrd);renderMission()}function moveOrd(id,d){const m=currentMission(),a=state.orders[m.id],i=a.indexOf(id),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];renderMission()}function checkOrder(){const m=currentMission(),a=state.orders[m.id];attempt(m.id,a);if(m.id==='S3M2'){const exp=['i2','i3','i4','i5'];return a.every((id,i)=>id===exp[i])?pass(m):showFeedback(false,'ลำดับยังไม่ต่อเนื่อง ลองคิดเป็น สร้างข้อมูล → วิเคราะห์ข้อมูล → ออกแบบแนวทาง → ทดสอบและปรับ')}a.every((id,i)=>m.items.find(x=>x.id===id).order===i+1)?pass(m):showFeedback(false,'ลำดับยังไม่สอดคล้องกับ dependency ของความสามารถ ลองถามว่า ขั้นถัดไปต้องอาศัยอะไรจากขั้นก่อน')}

function renderBridgeObjectives(){state.bridgeOrder??=shuffle(['bo2','bo3','bo4'],'bridge-objectives');const top=REF.plan7Objectives.slice(0,2),bottom=REF.plan7Objectives.slice(5,8);bridgeBody.innerHTML=`<div class="section-note"><strong>แผน 6 — จากสาเหตุสู่แนวทางลดเสียง</strong><ol>${REF.plan6Objectives.map(x=>`<li>${x}</li>`).join('')}</ol><p><strong>สิ่งที่ส่งมาให้แผน 7:</strong> ${REF.plan6Outputs.join(' · ')}</p></div><h3>เรียงจุดประสงค์ของแผน 7 — ทดลอง ตรวจสอบ และปรับแนวทาง</h3><p class="mini">ภารกิจนี้ให้หาลำดับเฉพาะ <strong>จุดประสงค์ 3, 4, 5</strong> โดยจุดประสงค์ 1, 2 และ 6, 7, 8 ถูกล็อกไว้แล้ว</p><div class="section-note"><strong>ล็อกจุดเริ่มต้น (ข้อ 1–2)</strong><ol>${top.map(x=>`<li>${x}</li>`).join('')}</ol></div><div class="order-list">${state.bridgeOrder.map(id=>{const i=Number(id.slice(2));return `<div class="order-item" draggable="true" ondragstart="bridgeDrag='${id}'" ondragover="event.preventDefault()" ondrop="dropBridgeOrd('${id}')"><div class="handle">☰</div><div class="order-label"><span class="tag">จุดประสงค์ ${i+1}</span><br>${REF.plan7Objectives[i]}</div><div class="order-actions"><button onclick="moveBridgeOrd('${id}',-1)">↑</button><button onclick="moveBridgeOrd('${id}',1)">↓</button></div></div>`}).join('')}</div><div class="section-note"><strong>ล็อกจุดปลาย (ข้อ 6–8)</strong><ol start="6">${bottom.map(x=>`<li>${x}</li>`).join('')}</ol><p class="mini"><strong>หมายเหตุ:</strong> จุดประสงค์ข้อ 8 เป็นเจตคติที่พัฒนาตลอดการทดลองและการใช้หลักฐาน ไม่ได้เกิดเฉพาะช่วงท้ายแผน</p></div><div class="section-note"><strong>แผน 8 — ข้อเสนอเพื่อพื้นที่สงบของโรงเรียน</strong><ol>${REF.plan8Objectives.map(x=>`<li>${x}</li>`).join('')}</ol><p>ข้อความนี้ทำหน้าที่เป็นคำใบ้ว่าแผน 7 ต้องสร้างหลักฐานอะไรไว้ให้พร้อมส่งต่อ</p></div>`;setActions(`<button class="btn" onclick="checkBridgeObjectives()">ตรวจลำดับ</button>`)}

function renderBridgePlanTable(){const spec=bridgeAssessSpec(),p=state.bridgePlacements.BR2??={};state.bridgePlacements.BR2=p;const placed=new Set(Object.values(p));bridgeBody.innerHTML=`<div class="section-note"><strong>ออกแบบเหมือนตารางในแผนจริง</strong> — อ่านกิจกรรมก่อน แล้วเลือกการประเมินเพื่อพัฒนาที่สัมพันธ์กับกิจกรรมนั้น ในแต่ละแถวล็อก AaL หรือ AfL ไว้ให้แล้ว 1 ป้าย</div><table class="rubric"><tr><th style="width:20%">ขั้น / เวลา</th><th>กิจกรรมการเรียนรู้</th><th style="width:36%">การประเมินเพื่อพัฒนา</th></tr>${REF.plan7Rows.map((r,i)=>{const sp=spec[i],id=p['r'+i],card=sp.cardId===id?sp.cardText:'';return `<tr><td class="rowhead">${r.stage}</td><td>${r.activity}</td><td><div class="placed-card"><span class="tag">ล็อก ${sp.lockedType}</span><br>${sp.lockedText}</div><div class="dropzone" style="margin-top:8px" onclick="placeBridgeAssess('r${i}')" ondragover="event.preventDefault();this.classList.add('ready')" ondragleave="this.classList.remove('ready')" ondrop="dropBridgeAssess(event,'r${i}')"><div class="mini">หา ${sp.needType} ที่เข้าคู่กับกิจกรรมนี้</div>${card?`<div class="placed-card">${card}<div><button class="mini-btn" onclick="event.stopPropagation();unplaceBridgeAssess('r${i}')">คืนป้าย</button></div></div>`:'<div class="mini" style="text-align:center;padding-top:8px">วางป้ายที่นี่</div>'}</div></td></tr>`}).join('')}</table><div class="bank">${shuffle(spec.filter(x=>!placed.has(x.cardId)).map(x=>x.cardId),'br2').map(id=>{const sp=spec.find(x=>x.cardId===id);return `<div class="drag-card ${state.selectedCard==='BR2|'+id?'selected':''}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','BR2|${id}')" onclick="selectBridgeAssess('${id}')"><div class="card-id">ป้ายการประเมินเพื่อพัฒนา</div><div>${sp.cardText}</div></div>`}).join('')}</div><div class="section-note"><strong>ผลผลิตที่ต้องพร้อมก่อนจบแผน 7:</strong> ${REF.plan7Outputs.join(' · ')}</div>`;setActions(`<button class="btn" onclick="checkBridgeAssess()">ตรวจคำตอบ</button>`)}
function selectBridgeAssess(id){state.selectedCard='BR2|'+id;renderMission()}function placeBridgeAssess(key){if(!state.selectedCard?.startsWith('BR2|'))return;assignBridgeAssess(key,state.selectedCard.split('|')[1])}function dropBridgeAssess(e,key){e.preventDefault();const d=e.dataTransfer.getData('text/plain');if(d.startsWith('BR2|'))assignBridgeAssess(key,d.split('|')[1])}function assignBridgeAssess(key,id){const p=state.bridgePlacements.BR2??={};Object.keys(p).forEach(k=>{if(p[k]===id)delete p[k]});p[key]=id;state.bridgePlacements.BR2=p;state.selectedCard=null;renderMission()}function unplaceBridgeAssess(key){const p=state.bridgePlacements.BR2??={};delete p[key];renderMission()}function checkBridgeAssess(){const spec=bridgeAssessSpec(),p=state.bridgePlacements.BR2??{};if(Object.keys(p).length<3)return showFeedback(false,'ยังมีช่องการประเมินที่ยังไม่ได้เติมครบ');attempt('BR-ASSESS',p);let wrong=0;spec.forEach((sp,i)=>{if(p['r'+i]!==sp.cardId)wrong++});if(wrong)return showFeedback(false,`ยังมี ${wrong} ป้ายที่ไม่สัมพันธ์กับกิจกรรมในแถวนั้น ลองดูว่าใครเป็นผู้ใช้หลักฐานและใช้เพื่อปรับอะไร`);bridgePassed()}

function updateProgress(){if(!stagebar)return;const cs=currentMission()?.stage;const groups=[['s1','Stage 1'],['s2','Stage 2'],['s3','Stage 3'],['bridge','หน่วย→แผน']];stagebar.innerHTML='<span class="stage-chip done">✓ ข้อมูล</span>'+groups.map(([g,l])=>{const ms=STAGES[g].missions,d=ms.every(x=>state.completed.has(x)),cur=cs===g;return`<span class="stage-chip ${d?'done':cur?'current':'locked'}">${d?'✓ ':cur?'● ':''}${l}</span>`}).join('');missionCount.textContent=`ภารกิจ ${Math.min(state.current+1,MISSIONS.length)}/${MISSIONS.length}`;const st=STAGES[cs];subprogress.innerHTML=st?st.missions.map(id=>{const m=MISSIONS.find(x=>x.id===id),done=state.completed.has(id),cur=idx(id)===state.current;return`<span class="subnode ${done?'done':cur?'current':''}">${done?'✓ ':cur?'● ':''}${shortTitle(m)}</span>`}).join(''):'';if(window.liveFlow){const nodes=[['DATA','ตัวชี้วัด'],...MISSIONS.map(m=>[m.id,shortTitle(m)])];liveFlow.innerHTML=nodes.map(([id,label],i)=>{const isData=id==='DATA',mi=isData?-1:idx(id),done=isData||state.completed.has(id),cur=!isData&&mi===state.current&&!done,cls=done?'done':cur?'current':'locked',click=done?(isData?`onclick="showReference('indicators')"`:`onclick="openReview('${id}')"`):'';return`${i?'<span class="arrow">→</span>':''}<button class="flow-node ${cls}" ${click}>${done?'✓ ':cur?'● ':''}${label}</button>`}).join('')}}
function shortTitle(m){return({S1M1:'องค์ประกอบ',S1M2:'CLO',S1M3:'สมรรถนะ',S1M4:'K–S–A',S2M1:'ระบบหลักฐาน',S2M2:'Task',S2M3:'Rubric',S2M4:'หลักฐาน K–S–A',S3M1:'Sub-CLO',S3M2:'เรียง SC',S3M3:'8 แผน',S3M4:'Learning Path',BRM1:'แผน 7'})[m.id]}
function reviewPrevious(){const d=[...state.completed].map(idx).filter(i=>i<state.current).sort((a,b)=>b-a);d.length?openReview(MISSIONS[d[0]].id):showReference('indicators')}function openReview(id){const m=MISSIONS.find(x=>x.id===id);if(state.completed.has(id)){state.reviewHistory.push(id);openModal(m.reviewTitle,reviewHtml(id),'โหมดทบทวน')}}function openFlowMap(){const groups=[['Stage 1',STAGES.s1.missions],['Stage 2',STAGES.s2.missions],['Stage 3',STAGES.s3.missions],['หน่วย → แผน',STAGES.bridge.missions]];openModal('แผนผังการออกแบบ',`<div class="flowmap"><div class="flow-stage"><h3>ข้อมูลตั้งต้น</h3><button class="flow-node done" onclick="showReference('indicators')">กลุ่มตัวชี้วัด ✓</button></div>${groups.map(([l,ids])=>`<div class="flow-stage"><h3>${l}</h3><div class="flow-row">${ids.map((id,i)=>{const m=MISSIONS.find(x=>x.id===id),d=state.completed.has(id),c=idx(id)===state.current&&!d;return`${i?'<span class="arrow">→</span>':''}<button class="flow-node ${d?'done':c?'current':'locked'}" ${d?`onclick="openReview('${id}')"`:''}>${shortTitle(m)} ${d?'✓':c?'●':'🔒'}</button>`}).join('')}</div></div>`).join('')}<div class="section-note">แผนผังนี้แสดงตรรกะหลัก ไม่ใช่ขั้นตอนตายตัว สามารถย้อนกลับเพื่อตรวจ Alignment ได้</div></div>`,'Interactive Flow Chart')}
function showReference(k){if(k==='indicators')openModal('กลุ่มตัวชี้วัด',`<div class="brief-grid">${indicatorHtml()}</div>`,'ข้อมูลต้นทาง');if(k==='ksa')openModal('K–S–A ที่จำเป็น',ksaHtml(),'ข้อมูลต้นทาง');if(k==='rubric')openModal('Analytic Rubric',RUBRIC_CORRECT,'ข้อมูลต้นทาง')}
function openModal(t,h,tag='รายละเอียด'){modalTitle.textContent=t;modalBody.innerHTML=h;modalTag.textContent=tag;modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}modal.addEventListener('click',e=>{if(e.target===modal)closeModal()})
function finishGame(){state.finishedAt=new Date().toISOString();missionScreen.classList.add('hidden');finalScreen.classList.remove('hidden');renderFinal();submitResult();updateProgress();scrollTo({top:0,behavior:'smooth'})}function stats(){const sec=Math.max(0,Math.round((new Date(state.finishedAt)-new Date(state.startedAt))/1000));return{time:`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`,attempts:Object.values(state.attempts).reduce((a,b)=>a+b,0),first:Object.values(state.firstTry).filter(Boolean).length,hints:Object.values(state.hints).reduce((a,b)=>a+b,0)}}
function renderFinal(){const s=stats();finalScreen.innerHTML=`<div class="panel final-card"><div style="font-size:46px">✓</div><div class="kicker">Mission Complete</div><h2>คุณได้ประกอบหน่วยการเรียนรู้หนึ่งหน่วยแล้ว</h2><p>${esc(state.participant.name)} · ${esc(state.participant.org)}</p><div class="summary-map"><div class="summary-node">ตัวชี้วัด 9 ตัว</div><div class="arrow">↓</div><div class="summary-node">ความเข้าใจที่ยั่งยืน (EU) · คำถามสำคัญ (EQ) · CLO</div><div class="summary-split"><div class="summary-node">สมรรถนะหลัก 4 ด้าน</div><div class="summary-node">K–S–A</div></div><div class="arrow">↓</div><div class="summary-split"><div class="summary-node">Performance Task + Analytic Rubric</div><div class="summary-node">หลักฐาน K–S–A × AaL/AfL/AoL</div></div><div class="arrow">↓</div><div class="summary-node">Sub-CLO 1 → 2 → 3 → 4 → 5 → 6</div><div class="arrow">↓</div><div class="summary-node">Learning Progression: 8 แผน / 8 ชั่วโมง มีทั้งช่วงตรงและช่วงเชื่อม</div><div class="arrow">↓</div><div class="summary-node">แผน 7: จุดประสงค์ → กิจกรรม → การประเมินระหว่างเรียน (AaL/AfL)</div></div><div class="section-note">เกมนี้เริ่มจากผลลัพธ์ปลายทาง กำหนดหลักฐาน แล้วค่อยออกแบบเส้นทางและแผนรายคาบ — ไม่ได้เริ่มจากเลือกกิจกรรมก่อน</div><div class="stats-grid"><div class="stat"><strong>${s.time}</strong><span>เวลา</span></div><div class="stat"><strong>${s.attempts}</strong><span>ครั้งที่ตรวจ</span></div><div class="stat"><strong>${s.first}</strong><span>ผ่านครั้งแรก</span></div><div class="stat"><strong>${s.hints}</strong><span>คำใบ้</span></div></div><div id="submitStatus" class="status warn">กำลังส่งข้อมูลไป Google Sheets…</div><div class="actions" style="justify-content:center"><button class="btn secondary" onclick="openFlowMap()">ทบทวนแผนผังทั้งหมด</button><button class="btn" onclick="continueAI()">ออกแบบหน่วยของฉันต่อด้วย AI →</button></div></div>`}
function payload(){const s=stats();return{gameVersion:GAME_VERSION,sessionId:state.sessionId,name:state.participant.name,organization:state.participant.org,startedAt:state.startedAt,finishedAt:state.finishedAt,elapsedSeconds:Math.round((new Date(state.finishedAt)-new Date(state.startedAt))/1000),completed:true,totalAttempts:s.attempts,totalHints:s.hints,firstTryCorrectCount:s.first,s1MatchAttempts:state.attempts.S1M1||0,cloAttempts:state.attempts.S1M2||0,ksavAttempts:state.attempts.S1M4||0,s1OrderAttempts:0,s2MatchAttempts:state.attempts.S2M1||0,performanceTaskAttempts:state.attempts.S2M2||0,rubricAttempts:state.attempts.S2M3||0,aalAttempts:state.attempts.S2M4||0,aflAttempts:state.attempts.S2M4||0,aolAttempts:state.attempts.S2M4||0,s3MatchAttempts:(state.attempts.S3M3||0)+(state.attempts.S3M4||0),s3OrderAttempts:state.attempts.S3M2||0,userAgent:navigator.userAgent,detail:{attempts:state.attempts,hints:state.hints,firstTry:state.firstTry,firstChoice:state.firstChoice,missionDurations:state.missionDur,reviewHistory:state.reviewHistory,completed:[...state.completed]}}}async function submitResult(){const el=document.getElementById('submitStatus');try{await fetch(GOOGLE_SHEET_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload())});state.submitted=true;if(el){el.className='status ok';el.textContent='ส่งข้อมูลผลการเล่นไปยัง Google Sheets แล้ว'}}catch(e){if(el){el.className='status warn';el.textContent='ส่งข้อมูลไม่สำเร็จ กรุณาตรวจการเชื่อมต่อ'}}}
function advisorText(){return`ผู้เข้าอบรม: ${state.participant.name} · ${state.participant.org}\n\nฉันเพิ่งจบ UbD–CBE Challenge v2.13 โปรดช่วยออกแบบหน่วยของฉันต่อ โดยใช้ลำดับนี้:\nStage 1: กลุ่มตัวชี้วัด → EU/EQ/CLO → สมรรถนะหลัก → K–S–A\nStage 2: Performance Task → Analytic Rubric → หลักฐาน K–S–A โดยพิจารณาหน้าที่ AaL/AfL/AoL\nStage 3: สังเคราะห์ Sub-CLO จาก CLO + K–S–A แล้วเรียงตาม progression; จำนวน Sub-CLO ไม่จำเป็นต้องเท่ากับจำนวนแผน และบางแผนอาจเชื่อมสอง Sub-CLO\nจากนั้นออกแบบ Learning Path และขยายเป็นแผนรายคาบตามความซับซ้อนจริง\nระดับแผน: จุดประสงค์เรียงตามความก้าวหน้า → กิจกรรมตาม เผชิญสถานการณ์ / คาดการณ์และลงมือ / สะท้อนคิด → AaL/AfL ที่สัมพันธ์กับกิจกรรม พร้อมเห็นสิ่งที่รับมาและส่งต่อ\n\nโปรดถามฉันทีละประเด็น ไม่สมมติตัวชี้วัดหรือข้อมูลที่ฉันยังไม่ได้ให้`;}
async function continueAI(){const t=advisorText();try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}window.open(AI_ADVISOR_URL,'_blank','noopener');alert('คัดลอกข้อความส่งต่อแล้ว เมื่อ AI เปิดขึ้นให้กด Ctrl+V')}
</script></body></html>
